<title>نتيجة ليالي دار الأرقم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one reading column. Logo masthead → seat lookup → result sheet (summary, surah ledger, exams) */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#03293f; --ink-2:#395d73; --muted:#64798a; --line:#dde4ea; --tint:#e8eef3;
  --navy:#03293f; --steel:#395d73; --gold:#b08a3e;
  --ok:#2f7a55; --ok-soft:#e3f1e9; --warn:#a2621b; --warn-soft:#f7ecdc; --bad:#a23a3a; --bad-soft:#f6e3e3;
  --f-display:"Reem Kufi","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --logo-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1620; --paper:#0f202c; --ink:#e3ecf2; --ink-2:#a9c2d3; --muted:#8aa1b1; --line:#1f3443; --tint:#15293a;
  --navy:#cfe0ec; --steel:#8fb0c6; --gold:#d6b26a;
  --ok:#77c79c; --ok-soft:#15301f; --warn:#e3a85b; --warn-soft:#33240f; --bad:#ec8f8f; --bad-soft:#371a1a;
  --logo-filter:invert(1) hue-rotate(180deg) brightness(1.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1620; --paper:#0f202c; --ink:#e3ecf2; --ink-2:#a9c2d3; --muted:#8aa1b1; --line:#1f3443; --tint:#15293a;
  --navy:#cfe0ec; --steel:#8fb0c6; --gold:#d6b26a;
  --ok:#77c79c; --ok-soft:#15301f; --warn:#e3a85b; --warn-soft:#33240f; --bad:#ec8f8f; --bad-soft:#371a1a;
  --logo-filter:invert(1) hue-rotate(180deg) brightness(1.05); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.page{max-width:640px;margin:0 auto;padding:36px 16px 56px;display:flex;flex-direction:column;gap:22px}

.mast{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.mast img{width:min(300px,78%);height:auto;filter:var(--logo-filter)}
.mast .rule{display:flex;align-items:center;gap:12px;color:var(--gold);font:600 14px var(--f-body);letter-spacing:.02em}
.mast .rule::before,.mast .rule::after{content:"";width:42px;height:1px;background:currentColor;opacity:.6}

.lookup{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.lookup label{font-weight:600;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
#seat{flex:1 1 220px;min-width:0;font:600 26px/1.2 var(--f-body);letter-spacing:.18em;text-align:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr}
#seat::placeholder{letter-spacing:0;font-weight:400;font-size:16px;color:var(--muted)}
#seat:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px var(--tint)}
.btn{flex:0 0 auto;font:600 16px var(--f-body);padding:12px 24px;border-radius:12px;border:0;background:var(--navy);color:var(--paper);cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,.ghost:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.msg{margin:0;min-height:1.7em;font-size:14px;color:var(--muted)}
.msg.err{color:var(--bad)}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.bar i{transition:none!important}}

.head{padding:22px 22px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line)}
.who{min-width:0;flex:1 1 260px}
.who h2{margin:0;font:600 25px/1.45 var(--f-display);color:var(--ink);text-wrap:balance}
.facts{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px;white-space:nowrap}
.g-ok{background:var(--ok-soft);color:var(--ok)} .g-warn{background:var(--warn-soft);color:var(--warn)} .g-bad{background:var(--bad-soft);color:var(--bad)}

.score{display:grid;grid-template-columns:1.3fr 1fr 1fr;border-bottom:1px solid var(--line)}
.score > div{padding:16px 12px;text-align:center;display:flex;flex-direction:column;gap:0;min-width:0}
.score > div + div{border-inline-start:1px solid var(--line)}
.score span{font-size:13px;color:var(--muted)}
.score strong{font:700 28px/1.35 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.score small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score .grade strong{font-size:22px;line-height:1.6}

.prog{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog p{margin:0;font-size:14px;color:var(--muted)}
.prog p b{color:var(--ink);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots span{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.dots span.on{background:var(--tint);border-color:transparent;color:var(--ink-2);font-weight:600}

.sec{padding:16px 22px 6px;margin:0;font:600 15px var(--f-display);color:var(--steel);letter-spacing:.01em}
.ledger{list-style:none;margin:0;padding:0 22px 8px}
.ledger > li{border-bottom:1px solid var(--line)}
.ledger > li:last-child{border-bottom:0}
details > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:4px 12px;align-items:center;padding:12px 0}
details > summary::-webkit-details-marker{display:none}
.sname{font-weight:600}
.sname small{font-weight:400;color:var(--muted);font-size:13px;margin-inline-start:6px}
.val{font-variant-numeric:tabular-nums;font-weight:700}
.val small{color:var(--muted);font-weight:400}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--steel);transition:width .7s ease-out}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.items{margin:0 0 14px;padding:10px 14px;background:var(--bg);border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 0;font-size:14px}
.items dt{color:var(--ink-2)} .items dd{margin:0;padding-inline-start:16px;font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
.items dd.z{color:var(--bad)}
.items .sum{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:600;color:var(--ink)}
.exams{list-style:none;margin:0;padding:0 22px 12px}
.exams li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.exams li:last-child{border-bottom:0}
.exams .pending{color:var(--muted);font-size:14px}
.foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg)}
.ghost{font:500 14px var(--f-body);background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:8px 16px;border-radius:10px;cursor:pointer}
.stamp{font-size:12px;color:var(--muted)}
.scale{font-size:12px;color:var(--muted);text-align:center;margin:0}
footer{text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:440px){
  .lookup,.head{padding:18px}.ledger,.exams,.sec{padding-inline:18px}.prog,.foot{padding-inline:18px}
  .score strong{font-size:23px}.score .grade strong{font-size:18px}
}
</style>

  function norm(v){
    return String(v).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-0x660})
      .replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-0x6F0}).replace(/\D/g,'');
  }
  async function lookup(seat){
    var base = await crypto.subtle.importKey('raw', te.encode(seat), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(DATA.salt),iterations:DATA.iter,hash:'SHA-256'}, base, 512);
    var rec = DATA.records[hex(bits.slice(32,44))];
    if(!rec) return null;
    var key = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(rec[0])}, key, b64d(rec[1]));
    return JSON.parse(td.decode(pt));
  }
  function grade(p){
    if(p>=90) return ['ممتاز','ok']; if(p>=80) return ['جيد جدًا','ok']; if(p>=70) return ['جيد','ok'];
    if(p>=60) return ['مقبول','warn']; return ['يحتاج متابعة','bad'];
  }
  var tone = function(p){ return p>=70?'ok':p>=60?'warn':'bad'; };
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>';

  $('foot').textContent = 'آخر تحديث: ' + M.updated + ' · لا تظهر النتيجة إلا لصاحب رقم الجلوس';

  function render(seat, r){
    var T = M.tracks[r.t], plan = M.plans[T.plan];
    var SMAX = M.imax.reduce(function(a,b){return a+b},0) + M.tmax;
    var earned = 0, possible = 0, rows = '';
    r.su.forEach(function(s){
      var name = s[0], it = s[1], x = s[2];
      var work = it.reduce(function(a,b){return a+b},0), test = x==null ? 0 : x;
      var tot = work + test, p = tot/SMAX*100;
      earned += tot; possible += SMAX;
      var dl = M.items.map(function(lbl,i){
        return '<dt>'+esc(lbl)+'</dt><dd class="'+(it[i]===0?'z':'')+'">'+ar(it[i])+' / '+ar(M.imax[i])+'</dd>';
      }).join('');
      dl += '<dt class="sum">أعمال السورة</dt><dd class="sum">'+ar(work)+' / '+ar(M.imax.reduce(function(a,b){return a+b},0))+'</dd>';
      dl += '<dt class="sum">اختبار السورة</dt><dd class="sum'+(x==null?' z':'')+'">'+(x==null?'لم يُرصد':ar(test)+' / '+ar(M.tmax))+'</dd>';
      rows += '<li><details><summary><span class="sname">سورة '+esc(name)+'</span>'+
        '<span class="val">'+ar(tot)+' <small>/ '+ar(SMAX)+'</small></span>'+CHEV+
        '<span class="bar"><i class="'+tone(p)+'" data-w="'+Math.min(100,p).toFixed(1)+'"></i></span></summary>'+
        '<dl class="items">'+dl+'</dl></details></li>';
    });
    var ex = '';
    T.exams.forEach(function(e){
      var v = r.ex[e.k];
      if(v!=null){ earned += v; possible += e.max; }
      ex += '<li><span>'+esc(e.label)+'</span>'+(v!=null ? '<span class="val">'+ar(v)+' <small>/ '+ar(e.max)+'</small></span>' : '<span class="pending">لم يُرصد بعد</span>')+'</li>';
    });
    var p = possible ? earned/possible*100 : 0, G = grade(p);
    var dots = plan.map(function(n){
      var on = r.su.some(function(s){return s[0]===n});
      return '<span class="'+(on?'on':'')+'">'+esc(n)+'</span>';
    }).join('');
    var facts = '<span>رقم الجلوس <b>'+ar(seat,0)+'</b></span><span>'+esc(T.label)+'</span>'+
      (r.g ? '<span>المجموعة <b>'+ar(r.g,0)+'</b></span>' : '')+
      (r.tch ? '<span>'+esc(T.tchLabel)+' <b>'+esc(r.tch)+'</b></span>' : '');
    var html = '<article class="sheet">'+
      '<div class="head"><div class="who"><h2>'+esc(r.n)+'</h2><p class="facts">'+facts+'</p></div>'+
      '<span class="pill g-'+G[1]+'">'+G[0]+'</span></div>'+
      '<div class="score"><div><span>المجموع حتى الآن</span><strong>'+ar(earned)+'</strong><small>من '+ar(possible)+'</small></div>'+
      '<div><span>النسبة</span><strong>'+ar(p)+'٪</strong><small>&nbsp;</small></div>'+
      '<div class="grade"><span>التقدير</span><strong>'+G[0]+'</strong><small>&nbsp;</small></div></div>'+
      '<div class="prog"><p>رُصدت <b>'+ar(r.su.length,0)+'</b> من <b>'+ar(plan.length,0)+'</b> سور في البرنامج.</p><div class="dots">'+dots+'</div></div>'+
      (r.su.length ? '<h3 class="sec">درجات السور <small style="font:400 12px var(--f-body);color:var(--muted)">(اضغط على السورة لعرض التفاصيل)</small></h3><ul class="ledger">'+rows+'</ul>' : '')+
      '<h3 class="sec">الاختبارات العامة</h3><ul class="exams">'+ex+'</ul>'+
      '<div class="foot"><span class="stamp">'+esc(M.title)+'</span><button class="ghost" type="button" id="again">بحث برقم آخر</button></div>'+
      '</article>';
    var out = $('result'); out.innerHTML = html;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      out.querySelectorAll('.bar i').forEach(function(i){ i.style.width = i.dataset.w + '%'; });
    }); });
    $('again').onclick = function(){ out.innerHTML=''; $('seat').value=''; $('msg').textContent=''; $('seat').focus(); };
    out.scrollIntoView({behavior:'smooth', block:'start'});
  }

  var fails = 0;
  $('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg = $('msg'), btn = $('go');
    var seat = norm($('seat').value);
    msg.className = 'msg';
    if(seat.length !== 8){ msg.className='msg err'; msg.textContent='رقم الجلوس ٨ أرقام. اكتبه كاملًا كما استلمته.'; return; }
    btn.disabled = true; msg.textContent = 'جارٍ البحث…';
    try{
      if(fails >= 5) await new Promise(function(r){setTimeout(r, 1500*(fails-4))});
      var r = await lookup(seat);
      if(!r){
        fails++; $('result').innerHTML='';
        msg.className='msg err'; msg.textContent='لا توجد نتيجة بهذا الرقم. راجع رقم الجلوس وحاول مرة أخرى.';
      } else { fails = 0; msg.textContent=''; render(seat, r); }
    } catch(err){
      msg.className='msg err'; msg.textContent='تعذّر عرض النتيجة على هذا المتصفح. جرّب متصفحًا آخر مثل Chrome.';
    }
    btn.disabled = false;
  });
})();
</script>

</body>
</html>
